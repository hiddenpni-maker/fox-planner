name: Build Android APKs & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify pre-installed Android SDK & accept licenses
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Generate Android native project (with ABI splits)
        run: npx expo prebuild --platform android --no-install

      - name: Decode Release Keystore (if configured in GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore
            echo "USE_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "USE_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build per-CPU & Universal Release APKs
        working-directory: android
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          chmod +x ./gradlew
          if [ "$USE_RELEASE_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease -PsplitApks=true \
              -Pandroid.injected.signing.store.file=app/release.keystore \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            ./gradlew assembleRelease -PsplitApks=true
          fi

      - name: Collect renamed APK artifacts
        run: |
          mkdir -p release-apks
          for abi in universal arm64-v8a armeabi-v7a x86_64; do
            SRC="android/app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "release-apks/fox-planner-${abi}.apk"
            fi
          done
          ls -lh release-apks

      - name: Determine tag & generate release version.json
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          TAG="$TAG" node -e '
            const fs = require("fs");
            const tag = process.env.TAG;
            const ver = tag.replace(/^v/i, "");
            const repo = process.env.GITHUB_REPOSITORY;
            const manifest = {
              version: ver,
              releaseDate: new Date().toISOString().slice(0, 10),
              notesFa: `نسخه جدید فاکس پلنر (${tag}) منتشر شد.`,
              notesEn: `Fox Planner ${tag} is now available.`,
              downloadPageUrl: `https://github.com/${repo}/releases/tag/${tag}`,
              apkUrls: {
                universal: `https://github.com/${repo}/releases/download/${tag}/fox-planner-universal.apk`,
                arm64: `https://github.com/${repo}/releases/download/${tag}/fox-planner-arm64-v8a.apk`,
                armv7: `https://github.com/${repo}/releases/download/${tag}/fox-planner-armeabi-v7a.apk`,
                x86_64: `https://github.com/${repo}/releases/download/${tag}/fox-planner-x86_64.apk`
              }
            };
            fs.writeFileSync("release-apks/version.json", JSON.stringify(manifest, null, 2));
          '

      - name: Publish GitHub Release with Multi-ABI APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Fox Planner ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          files: release-apks/*
