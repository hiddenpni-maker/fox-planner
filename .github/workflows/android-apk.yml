name: Build Android APKs & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode & verify Release Keystore (if configured in GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          CLEAN_B64=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')
          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          CLEAN_STORE_PASS=$(printf '%s' "$STORE_PASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -n "$CLEAN_B64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/fox-planner-release.keystore"
            printf '%s' "$CLEAN_B64" | base64 --decode > "$KEYSTORE_PATH"
            KEYSTORE_BYTES=$(wc -c < "$KEYSTORE_PATH")
            echo "Decoded release keystore bytes: $KEYSTORE_BYTES"
            if [ "$KEYSTORE_BYTES" -lt 1000 ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 decoded to only $KEYSTORE_BYTES bytes (expected ~2736 bytes). Re-copy the full Base64 string."
              exit 1
            fi
            if [ -z "$CLEAN_ALIAS" ] || [ -z "$CLEAN_STORE_PASS" ] || [ -z "$CLEAN_KEY_PASS" ]; then
              echo "::error::One of ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASS, or ANDROID_KEY_PASS is empty."
              exit 1
            fi
            keytool -list -keystore "$KEYSTORE_PATH" -alias "$CLEAN_ALIAS" -storepass "$CLEAN_STORE_PASS" > /dev/null
            printf "ok" > "$RUNNER_TEMP/probe.txt"
            PROBE_JAR="$RUNNER_TEMP/keystore_probe.jar"
            jar cf "$PROBE_JAR" -C "$RUNNER_TEMP" probe.txt
            jarsigner -keystore "$KEYSTORE_PATH" -storepass "$CLEAN_STORE_PASS" -keypass "$CLEAN_KEY_PASS" "$PROBE_JAR" "$CLEAN_ALIAS" > /dev/null
            rm -f "$PROBE_JAR" "$RUNNER_TEMP/probe.txt"
            echo "Keystore, alias, and passwords verified cleanly."
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "USE_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found; falling back to debug signing."
            echo "USE_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Verify pre-installed Android SDK & accept licenses
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Generate Android native project (with ABI splits)
        run: npx expo prebuild --platform android --no-install

      - name: Build per-CPU & Universal Release APKs
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PsplitApks=true

      - name: Collect, align & sign APK artifacts
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          mkdir -p release-apks
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)
          echo "Using build-tools: $BUILD_TOOLS"
          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          CLEAN_STORE_PASS=$(printf '%s' "$STORE_PASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          for abi in universal arm64-v8a armeabi-v7a x86_64; do
            SRC="android/app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ -f "$SRC" ]; then
              OUT="release-apks/fox-planner-${abi}.apk"
              if [ "$USE_RELEASE_KEYSTORE" = "true" ]; then
                TMP_ALIGNED="release-apks/aligned-${abi}.apk"
                "$BUILD_TOOLS/zipalign" -f -p 4 "$SRC" "$TMP_ALIGNED"
                "$BUILD_TOOLS/apksigner" sign \
                  --ks "$KEYSTORE_PATH" \
                  --ks-key-alias "$CLEAN_ALIAS" \
                  --ks-pass "pass:$CLEAN_STORE_PASS" \
                  --key-pass "pass:$CLEAN_KEY_PASS" \
                  --v1-signing-enabled true \
                  --v2-signing-enabled true \
                  --v3-signing-enabled true \
                  --out "$OUT" "$TMP_ALIGNED"
                rm -f "$TMP_ALIGNED"
                "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
              else
                cp "$SRC" "$OUT"
              fi
            fi
          done
          ls -lh release-apks

      - name: Determine tag & generate release version.json
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          TAG="$TAG" node -e '
            const fs = require("fs");
            const tag = process.env.TAG;
            const ver = tag.replace(/^v/i, "");
            const repo = process.env.GITHUB_REPOSITORY;
            const manifest = {
              version: ver,
              releaseDate: new Date().toISOString().slice(0, 10),
              notesFa: `نسخه جدید فاکس پلنر (${tag}) منتشر شد.`,
              notesEn: `Fox Planner ${tag} is now available.`,
              downloadPageUrl: `https://github.com/${repo}/releases/tag/${tag}`,
              apkUrls: {
                universal: `https://github.com/${repo}/releases/download/${tag}/fox-planner-universal.apk`,
                arm64: `https://github.com/${repo}/releases/download/${tag}/fox-planner-arm64-v8a.apk`,
                armv7: `https://github.com/${repo}/releases/download/${tag}/fox-planner-armeabi-v7a.apk`,
                x86_64: `https://github.com/${repo}/releases/download/${tag}/fox-planner-x86_64.apk`
              }
            };
            fs.writeFileSync("release-apks/version.json", JSON.stringify(manifest, null, 2));
          '

      - name: Publish GitHub Release with Multi-ABI APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Fox Planner ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          files: release-apks/*
